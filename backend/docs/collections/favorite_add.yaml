tags:
  - collection-favorites
summary: Ajouter une collection aux favoris
description: Marque la collection comme favorite pour l'utilisateur authentifie.
parameters:
  - in: path
    name: collection_id
    type: string
    format: uuid
    required: true
    description: Identifiant de la collection a ajouter aux favoris.
responses:
  201:
    description: Collection ajoutee aux favoris.
    schema:
      $ref: "#/definitions/CollectionFavorite"
  404:
    description: Collection introuvable ou non accessible.
