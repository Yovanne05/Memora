tags:
  - flashcards
summary: Dupliquer une flashcard
description: >
  Duplique une flashcard existante avec toutes ses réponses dans la même note.
  La flashcard dupliquée aura un nouvel identifiant unique mais conservera la même question et les mêmes réponses.
  
  **Permissions requises:** WRITE sur la note parente.
parameters:
  - in: path
    name: flashcard_id
    type: string
    format: uuid
    required: true
    description: Identifiant unique de la flashcard à dupliquer.
responses:
  201:
    description: Flashcard dupliquée avec succès.
    schema:
      $ref: "#/definitions/Flashcard"
  404:
    description: Flashcard source introuvable ou permission insuffisante.
