tags:
  - flashcards
summary: Créer une flashcard
description: >
  Crée une nouvelle flashcard avec sa question et ses réponses possibles.
  Au moins une réponse doit être marquée comme correcte.
  
  **Permissions requises:** WRITE sur la note.
parameters:
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Note à laquelle rattacher la flashcard.
  - in: body
    name: payload
    required: true
    schema:
      $ref: "#/definitions/FlashcardCreatePayload"
responses:
  201:
    description: Flashcard créée avec succès.
    schema:
      $ref: "#/definitions/Flashcard"
  400:
    description: >
      Validation échouée : aucune réponse fournie ou aucune réponse correcte.
  404:
    description: Note introuvable ou permission insuffisante.
  422:
    description: Erreur de validation Pydantic (liste de réponses vide).
