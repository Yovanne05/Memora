tags:
  - note-relations
summary: Supprimer une relation entre notes
description: >
  Supprime la relation entre la note ciblee et une autre note de la meme collection.
parameters:
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Note de reference.
  - in: path
    name: linked_note_id
    type: string
    format: uuid
    required: true
    description: Note reliee a dissocier.
responses:
  204:
    description: Relation supprimee.
  404:
    description: Note ou relation introuvable.
  422:
    description: Suppression invalide (meme note).
