tags:
  - reports
summary: Mettre à jour un signalement (déprécié, utiliser /reports/{id})
description: |
  Ancienne référence pour mise à jour de signalement. Utiliser `PATCH /reports/{id}`.
parameters:
  - name: report_id
    in: path
    required: true
    type: string
    format: uuid
  - in: body
    name: payload
    required: true
    schema:
      $ref: "#/definitions/ReportUpdatePayload"
responses:
  200:
    description: Signalement mis à jour.
    schema:
      $ref: "#/definitions/Report"
  401:
    description: Non authentifié.
  403:
    description: Réservé aux admins.
  404:
    description: Signalement introuvable.
