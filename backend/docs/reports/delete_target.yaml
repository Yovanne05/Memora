tags:
  - reports
summary: Supprimer la ressource ciblée et marquer le signalement résolu (admin)
description: >
  Supprime la note ou la collection liée au signalement, puis passe le statut à "resolved".
  Réservé aux admins.
parameters:
  - name: report_id
    in: path
    required: true
    type: string
    format: uuid
responses:
  200:
    description: Ressource supprimée, signalement mis à jour.
    schema:
      $ref: "#/definitions/Report"
  401:
    description: Non authentifié.
  403:
    description: Réservé aux admins.
  404:
    description: Signalement introuvable.
