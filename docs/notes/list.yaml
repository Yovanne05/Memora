tags:
  - notes
summary: Lister les notes
description: >
  Retourne la liste paginee des notes en appliquant des filtres facultatifs
  (proprietaire, collection, visibilite, texte).
parameters:
  - in: query
    name: ownerId
    type: string
    format: uuid
    required: false
    description: Limite la recherche aux notes appartenant a cet utilisateur.
  - in: query
    name: collectionId
    type: string
    format: uuid
    required: false
    description: Filtre sur une collection precise.
  - in: query
    name: sharedWithUserId
    type: string
    format: uuid
    required: false
    description: Renvoie uniquement les notes partagees avec cet utilisateur.
  - in: query
    name: visibility
    type: string
    enum: ["private", "public"]
    required: false
    description: Filtre les notes selon leur niveau de partage.
  - in: query
    name: titleContains
    type: string
    required: false
    description: Sous-chaine a rechercher dans les titres.
  - in: query
    name: contentContains
    type: string
    required: false
    description: Sous-chaine recherchee dans le contenu.
  - in: query
    name: ids
    type: string
    required: false
    description: Liste CSV d'identifiants (ex. `uuid1,uuid2`) pour recuperer un sous-ensemble precis.
  - in: query
    name: isFavorite
    type: boolean
    required: false
    description: Si true, ne renvoie que les notes favorites de l'utilisateur courant.
  - in: query
    name: tagIds
    type: string
    required: false
    description: Liste CSV d'identifiants de tags; la note doit contenir tous les tags fournis.
  - in: query
    name: sortBy
    type: string
    enum: ["title", "created_at", "updated_at"]
    default: "created_at"
    description: Champ utilise pour trier les resultats.
  - in: query
    name: sortDir
    type: string
    enum: ["asc", "desc"]
    default: "desc"
    description: Ordre de tri.
  - in: query
    name: limit
    type: integer
    format: int32
    default: 50
    minimum: 1
    maximum: 200
    description: Nombre maximum d'elements renvoyes.
  - in: query
    name: offset
    type: integer
    format: int32
    default: 0
    minimum: 0
    description: Decalage pour la pagination.
responses:
  200:
    description: Liste paginee des notes.
    schema:
      $ref: "#/definitions/NoteListResponse"
