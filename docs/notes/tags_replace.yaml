tags:
  - notes
summary: Remplacer les tags d'une note
description: Met a jour la liste complete des tags d'une note (remplacement).
parameters:
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Identifiant de la note.
  - in: body
    name: body
    required: true
    schema:
      $ref: "#/definitions/TagAssignPayload"
responses:
  200:
    description: Liste a jour des tags associes.
    schema:
      $ref: "#/definitions/TagListResponse"
  404:
    description: Note ou tag introuvable.
