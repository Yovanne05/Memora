tags:
  - flashcards
summary: Modifier une flashcard
description: >
  Met à jour la question et/ou les réponses d'une flashcard existante.
  Si les réponses sont modifiées, exactement une doit être correcte.
parameters:
  - in: path
    name: flashcard_id
    type: string
    format: uuid
    required: true
    description: Identifiant unique de la flashcard.
  - in: body
    name: payload
    required: true
    schema:
      $ref: "#/definitions/FlashcardUpdatePayload"
responses:
  200:
    description: Flashcard mise à jour avec succès.
    schema:
      $ref: "#/definitions/Flashcard"
  400:
    description: >
      Validation échouée : liste de réponses vide, aucune réponse correcte,
      ou plusieurs réponses correctes.
  404:
    description: Flashcard introuvable.
  422:
    description: Erreur de validation Pydantic (liste de réponses vide).
