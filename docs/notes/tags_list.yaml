tags:
  - notes
summary: Lister les tags d'une note
description: Retourne tous les tags associes a une note.
parameters:
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Identifiant de la note.
responses:
  200:
    description: Liste des tags associes.
    schema:
      $ref: "#/definitions/TagListResponse"
  404:
    description: Note introuvable.
