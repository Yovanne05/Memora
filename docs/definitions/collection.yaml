definitions:
  Collection:
    type: object
    description: Complete representation of a collection in MEMORA.
    properties:
      id:
        type: string
        format: uuid
        description: Unique identifier of the collection.
        example: "2be69704-ec97-4dce-903f-1f1dd01bc172"
      name:
        type: string
        description: Collection name, unique per owner.
        example: "Mes cours de maths"
      description:
        type: string
        nullable: true
        description: Optional description.
        example: "Collection de mes cours de maths"
      visibility:
        type: string
        enum: ["private", "public"]
        description: Who can see the collection.
        example: "private"
      owner_id:
        type: string
        format: uuid
        description: Identifier of the collection owner.
        example: "7bf403d9-98d9-468e-91b1-8c1f9ac1846f"
      tags:
        type: array
        description: Tags associated with this collection.
        items:
          type: string
        example: ["mathématiques", "algèbre", "université"]
      created_at:
        type: string
        format: date-time
        description: Creation date.
        example: "2025-05-12T09:23:41Z"
      updated_at:
        type: string
        format: date-time
        description: Last update date.
        example: "2025-05-15T16:02:07Z"
      notes:
        type: array
        description: Notes linked to this collection.
        items:
          $ref: "#/definitions/Note"
      edges:
        type: array
        description: Graph edges for visualization.
        items:
          type: object
        example: []
      nodes:
        type: array
        description: Graph nodes for visualization.
        items:
          type: object
        example: []
    required:
      - id
      - name
      - visibility
      - owner_id
      - tags
      - created_at
      - updated_at
      - notes
      - edges
      - nodes

  CollectionCreatePayload:
    type: object
    description: Data needed to create a collection.
    required: ["name", "owner_id"]
    properties:
      name:
        type: string
        maxLength: 50
        description: Collection name.
        example: "Mes cours de maths"
      description:
        type: string
        nullable: true
        description: Optional description.
        example: "Collection de mes cours de maths"
      owner_id:
        type: string
        format: uuid
        description: Identifier of the user creating the collection.
        example: "7bf403d9-98d9-468e-91b1-8c1f9ac1846f"
      visibility:
        type: string
        enum: ["private", "public"]
        default: "private"
        description: Visibility level.
        example: "private"
      tags:
        type: array
        description: Tags to associate with the collection.
        items:
          type: string
        example: ["mathématiques", "université"]

  CollectionUpdatePayload:
    type: object
    description: Fields that can be updated on a collection.
    properties:
      name:
        type: string
        maxLength: 50
        description: New name.
        example: "Mes cours d'algebre"
      description:
        type: string
        nullable: true
        description: New description.
        example: "Collection mise a jour avec de nouveaux cours en algebre"
      visibility:
        type: string
        enum: ["private", "public"]
        description: New visibility.
        example: "public"
      tags:
        type: array
        description: New tags for the collection.
        items:
          type: string
        example: ["algèbre", "licence"]

  CollectionListResponse:
    type: object
    description: Paginated response for collections.
    properties:
      total:
        type: integer
        format: int32
        description: Total number of collections matching the filter.
        example: 42
      items:
        type: array
        items:
          $ref: "#/definitions/Collection"
    required: ["total", "items"]

  CollectionShare:
    type: object
    description: Sharing configuration for a collection.
    properties:
      collection_id:
        type: string
        format: uuid
        description: Identifier of the shared collection.
      user_id:
        type: string
        format: uuid
        description: Target user.
      permission:
        type: string
        enum: ["read", "write"]
        description: Access level granted.
      created_at:
        type: string
        format: date-time
        description: Date when the share was created.
    required: ["collection_id", "user_id", "permission", "created_at"]

  CollectionShareCreatePayload:
    type: object
    required: ["user_id"]
    properties:
      user_id:
        type: string
        format: uuid
        description: User to grant access to.
      permission:
        type: string
        enum: ["read", "write"]
        default: "read"
        description: Access level to grant.

  CollectionShareUpdatePayload:
    type: object
    required: ["permission"]
    properties:
      permission:
        type: string
        enum: ["read", "write"]
        description: New access level.

  CollectionShareListResponse:
    type: object
    properties:
      total:
        type: integer
        format: int32
        description: Number of shares for the collection.
        example: 2
      items:
        type: array
        items:
          $ref: "#/definitions/CollectionShare"
    required: ["total", "items"]
