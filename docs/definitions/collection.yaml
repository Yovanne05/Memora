  Collection:
    type: object
    description: Représentation complète d'une collection de notes dans MEMORA.
    properties:
      id:
        type: string
        format: uuid
        description: Identifiant unique de la collection.
        example: "2be69704-ec97-4dce-903f-1f1dd01bc172"
      name:
        type: string
        description: Nom de la collection, unique pour un même propriétaire.
        example: "Mes cours de maths"
      description:
        type: string
        nullable: true
        description: Description facultative de la collection.
        example: "Collection de mes cours de maths"
      visibility:
        type: string
        enum: ["private", "public"]
        description: Contrôle qui peut voir la collection.
        example: "private"
      owner_id:
        type: string
        format: uuid
        description: Identifiant du propriétaire de la collection.
        example: "7bf403d9-98d9-468e-91b1-8c1f9ac1846f"
      created_at:
        type: string
        format: date-time
        description: Date de création de la collection.
        example: "2025-05-12T09:23:41Z"
      updated_at:
        type: string
        format: date-time
        description: Dernière mise à jour de la collection.
        example: "2025-05-15T16:02:07Z"
      notes:
        type: array
        description: Liste des notes rattachées à cette collection.
        items:
          $ref: "#/definitions/Note"
    required:
      - id
      - name
      - visibility
      - owner_id
      - created_at
      - updated_at
      - notes

  CollectionCreatePayload:
    type: object
    description: Données nécessaires pour créer une nouvelle collection.
    required: ["name", "owner_id"]
    properties:
      name:
        type: string
        maxLength: 50
        description: Nom de la collection.
        example: "Mes cours de maths"
      description:
        type: string
        nullable: true
        description: Description facultative.
        example: "Collection de mes cours de maths"
      owner_id:
        type: string
        format: uuid
        description: Identifiant de l’utilisateur qui crée la collection.
        example: "7bf403d9-98d9-468e-91b1-8c1f9ac1846f"
      visibility:
        type: string
        enum: ["private", "public"]
        default: "private"
        description: Niveau de visibilité de la collection.
        example: "private"

  CollectionUpdatePayload:
    type: object
    description: Champs modifiables d’une collection.
    properties:
      name:
        type: string
        maxLength: 50
        description: Nouveau nom de la collection.
        example: "Mes cours d'algèbre"
      description:
        type: string
        nullable: true
        description: Nouvelle description.
        example: "Collection mise à jour avec de nouveaux cours en algèbre"
      visibility:
        type: string
        enum: ["private", "public"]
        description: Nouvelle visibilité.
        example: "public"

  CollectionListResponse:
    type: object
    description: Réponse paginée pour la liste des collections.
    properties:
      total:
        type: integer
        format: int32
        description: Nombre total de collections correspondant au filtre.
        example: 42
      items:
        type: array
        items:
          $ref: "#/definitions/Collection"
    required: ["total", "items"]
