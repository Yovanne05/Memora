definitions:
  AuthRegisterPayload:
    type: object
    required: ["email", "password"]
    properties:
      email:
        type: string
        format: email
        description: Unique email used for login.
        example: "user@example.com"
      password:
        type: string
        format: password
        description: >
          Minimum 8 characters with at least one uppercase letter,
          one digit, and one special character.
        example: "StrongPass1!"
      username:
        type: string
        minLength: 3
        maxLength: 50
        nullable: true
        description: Optional public handle.
        example: "janedoe"
      display_name:
        type: string
        maxLength: 100
        nullable: true
        description: Optional display name.
        example: "Jane Doe"
    example:
      email: "user@example.com"
      password: "StrongPass1!"
      username: "janedoe"
      display_name: "Jane Doe"

  AuthLoginPayload:
    type: object
    required: ["identifier", "password"]
    properties:
      identifier:
        type: string
        description: Email or username.
        example: "user@example.com"
      password:
        type: string
        format: password
        description: Raw password matching the complexity policy.
        example: "StrongPass1!"
    example:
      identifier: "user@example.com"
      password: "StrongPass1!"

  AuthResponse:
    type: object
    required: ["access_token", "user"]
    properties:
      access_token:
        type: string
        description: JWT bearer token valid for 24 hours.
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      user:
        $ref: "#/definitions/User"
    example:
      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      user:
        id: "d9aeac85-71b5-4fd8-b7fd-58ab2e07f05b"
        email: "user@example.com"
        username: "janedoe"
        display_name: "Jane Doe"
        role: "client"
        is_active: true
        last_login: "2025-12-14T11:00:00Z"
        created_at: "2025-12-14T10:00:00Z"

  AuthMeResponse:
    type: object
    required: ["user"]
    properties:
      user:
        $ref: "#/definitions/User"
    example:
      user:
        id: "d9aeac85-71b5-4fd8-b7fd-58ab2e07f05b"
        email: "user@example.com"
        username: "janedoe"
        display_name: "Jane Doe"
        role: "client"
        is_active: true
        last_login: "2025-12-14T11:00:00Z"
        created_at: "2025-12-14T10:00:00Z"
