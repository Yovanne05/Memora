tags:
  - collection-share-links
summary: Lister les liens de partage
description: >
  Retourne la liste paginée des liens de partage créés pour les collections de l'utilisateur.
parameters:
  - in: query
    name: collectionId
    type: string
    format: uuid
    required: false
    description: Filtre sur une collection spécifique.
  - in: query
    name: sortBy
    type: string
    enum: ["created_at"]
    default: "created_at"
    description: Champ utilisé pour trier les résultats.
  - in: query
    name: sortDir
    type: string
    enum: ["asc", "desc"]
    default: "desc"
    description: Ordre de tri.
  - in: query
    name: limit
    type: integer
    format: int32
    default: 50
    minimum: 1
    maximum: 200
    description: Nombre maximum d'éléments renvoyés.
  - in: query
    name: offset
    type: integer
    format: int32
    default: 0
    minimum: 0
    description: Décalage pour la pagination.
responses:
  200:
    description: Liste paginée des liens de partage.
    schema:
      $ref: "#/definitions/CollectionShareLinkListResponse"
