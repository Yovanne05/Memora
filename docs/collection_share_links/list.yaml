tags:
  - collection-share-links
summary: Lister les liens de partage
description: >
  Retourne la liste des liens de partage créés pour les collections de l'utilisateur,
  triée par date de création décroissante.
parameters:
  - in: query
    name: collectionId
    type: string
    format: uuid
    required: false
    description: Filtre sur une collection spécifique.
responses:
  200:
    description: Liste des liens de partage.
    schema:
      $ref: "#/definitions/CollectionShareLinkListResponse"
