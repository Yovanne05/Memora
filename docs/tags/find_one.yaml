tags:
  - tags
summary: Recuperer un tag
description: Retourne un tag par identifiant.
parameters:
  - in: path
    name: tag_id
    type: string
    format: uuid
    required: true
    description: Identifiant du tag.
responses:
  200:
    description: Tag trouve.
    schema:
      $ref: "#/definitions/Tag"
  404:
    description: Tag introuvable.
