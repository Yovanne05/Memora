tags:
  - tags
summary: Mettre a jour un tag
description: Modifie les champs d'un tag existant.
parameters:
  - in: path
    name: tag_id
    type: string
    format: uuid
    required: true
    description: Identifiant du tag.
  - in: body
    name: body
    required: true
    schema:
      $ref: "#/definitions/TagUpdatePayload"
responses:
  200:
    description: Tag mis a jour.
    schema:
      $ref: "#/definitions/Tag"
  404:
    description: Tag introuvable.
  409:
    description: Conflit sur le nom du tag.
