---
tags:
  - tags
summary: Lister les tags
description: >
  Retourne la liste paginee des tags avec filtres facultatifs.
parameters:
  - in: query
    name: name
    type: string
    required: false
    description: Filtre exact sur le nom.
  - in: query
    name: nameContains
    type: string
    required: false
    description: Sous-chaine recherchee dans le nom.
  - in: query
    name: ids
    type: string
    required: false
    description: Liste CSV d'identifiants (ex. `uuid1,uuid2`) pour recuperer un sous-ensemble precis.
  - in: query
    name: sortBy
    type: string
    enum: ["name", "created_at", "id"]
    default: "created_at"
    description: Champ utilise pour trier les resultats.
  - in: query
    name: sortDir
    type: string
    enum: ["asc", "desc"]
    default: "desc"
    description: Ordre de tri.
  - in: query
    name: limit
    type: integer
    format: int32
    default: 50
    minimum: 1
    maximum: 200
    description: Nombre maximum d'elements renvoyes.
  - in: query
    name: offset
    type: integer
    format: int32
    default: 0
    minimum: 0
    description: Decalage pour la pagination.
responses:
  200:
    description: Liste paginee des tags.
    schema:
      $ref: "#/definitions/TagListResponse"
