tags:
  - flashcards
summary: Lister les flashcards
description: >
  Retourne les flashcards accessibles par l'utilisateur selon ses permissions sur les notes.
  
  **Permissions requises:** READ, WRITE ou OWNER sur la note pour voir ses flashcards.
parameters:
  - in: query
    name: note_id
    type: string
    format: uuid
    required: false
    description: Filtre sur une note spécifique.
  - in: query
    name: question_contains
    type: string
    required: false
    description: Recherche par texte dans les questions.
  - in: query
    name: sort_by
    type: string
    enum: ["question", "created_at", "updated_at"]
    default: "created_at"
    description: Champ de tri.
  - in: query
    name: sort_dir
    type: string
    enum: ["asc", "desc"]
    default: "desc"
    description: Direction de tri.
  - in: query
    name: limit
    type: integer
    format: int32
    default: 50
    minimum: 1
    maximum: 200
    description: Nombre maximum de résultats.
  - in: query
    name: offset
    type: integer
    format: int32
    default: 0
    minimum: 0
    description: Décalage pour la pagination.
responses:
  200:
    description: Liste des flashcards.
    schema:
      $ref: "#/definitions/FlashcardListResponse"
