tags:
  - shared
summary: Accéder à une collection via un lien de partage public
description: >
  Récupère une collection en utilisant l'ID du lien de partage.
  Aucune authentification n'est requise.
parameters:
  - in: path
    name: link_id
    type: string
    format: uuid
    required: true
    description: ID du lien de partage (clé primaire).
    example: "b2c3d4e5-6789-01bc-def0-234567890abc"
responses:
  200:
    description: Collection récupérée avec succès.
    schema:
      $ref: "#/definitions/Collection"
  404:
    description: Lien de partage non trouvé ou invalide.
  422:
    description: ID malformé.
