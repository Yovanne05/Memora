tags:
  - note-public-links
summary: Supprimer un lien public
description: >
  Revoque un lien public. L'acces via ce lien est immediatement invalide.
parameters:
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Identifiant de la note.
  - in: path
    name: link_id
    type: string
    format: uuid
    required: true
    description: Identifiant du lien public a supprimer.
responses:
  204:
    description: Lien public supprime avec succes.
  404:
    description: Lien ou note introuvable.
