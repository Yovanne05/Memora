tags:
  - note-share-links
summary: Lister les liens de partage
description: >
  Retourne la liste des liens de partage créés pour les notes de l'utilisateur,
  triée par date de création décroissante.
parameters:
  - in: query
    name: noteId
    type: string
    format: uuid
    required: false
    description: Filtre sur une note spécifique.
responses:
  200:
    description: Liste des liens de partage.
    schema:
      $ref: "#/definitions/NoteShareLinkListResponse"
