tags:
  - auth
summary: Statistiques utilisateur
description: >
  Retourne les statistiques de l'utilisateur connecte : nombre de notes,
  collections et flashcards crees, ainsi que le nombre de partages effectues.
  Les statistiques de revision seront ajoutees dans une version future.
responses:
  200:
    description: Statistiques de l'utilisateur.
    schema:
      $ref: "#/definitions/UserStatistics"
  401:
    description: Token absent ou invalide.
