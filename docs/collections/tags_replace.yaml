---
tags:
  - collections
summary: Remplacer les tags d'une collection
description: Met a jour la liste complete des tags d'une collection (remplacement).
parameters:
  - in: path
    name: collection_id
    type: string
    format: uuid
    required: true
    description: Identifiant de la collection.
  - in: body
    name: body
    required: true
    schema:
      $ref: "#/definitions/TagAssignPayload"
responses:
  200:
    description: Liste a jour des tags associes.
    schema:
      $ref: "#/definitions/TagListResponse"
  404:
    description: Collection ou tag introuvable.
