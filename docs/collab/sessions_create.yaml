tags:
  - collab
summary: Create a collab session
description: >
  Creates a short-lived collab token for a note.
parameters:
  - in: body
    name: payload
    required: true
    schema:
      $ref: "#/definitions/CollabSessionCreatePayload"
responses:
  200:
    description: Collab session created.
    schema:
      $ref: "#/definitions/CollabSessionResponse"
  401:
    description: Missing or invalid auth token.
  403:
    description: Insufficient permissions for the note.
  404:
    description: Note not found.
  422:
    description: Invalid payload.
