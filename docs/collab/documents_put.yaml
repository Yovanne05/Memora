tags:
  - collab
summary: Store collab document data
description: >
  Stores the Yjs snapshot (source of truth).
security:
  - apiKeyAuth: []
parameters:
  - in: header
    name: X-API-Key
    type: string
    required: true
    description: API key for collab endpoints.
  - in: path
    name: note_id
    type: string
    format: uuid
    required: true
    description: Note identifier.
  - in: body
    name: payload
    required: true
    schema:
      $ref: "#/definitions/CollabDocumentUpdatePayload"
responses:
  204:
    description: Collab document stored.
  400:
    description: Missing snapshot.
  401:
    description: Missing or invalid API key.
  404:
    description: Note not found.
