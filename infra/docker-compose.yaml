services:
  backend:
    image: ghcr.io/dut-info-montreuil/memora-backend:latest
    restart: unless-stopped
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://memora:memora@postgres:5432/memora
      SWAGGER_ENABLED: "0"
      JWT_SECRET_KEY: "change-me"
      JWT_ACCESS_TOKEN_EXPIRES_SECONDS: "86400"
      ALLOWED_ORIGINS: "http://localhost:8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      COLLAB_SESSION_TTL_SECONDS: "86400"
      IMAGE_MAX_CONTENT_LENGTH_BYTES: "5242880"
      STORAGE_DRIVER: "local"
      UPLOAD_LOCAL_ROOT: "/app/uploads"
      UPLOAD_PUBLIC_BASE_URL: "http://localhost:5000/uploads"
      # --- S3/SeaweedFS example ---
      # STORAGE_DRIVER: "s3"
      # UPLOAD_PUBLIC_BASE_URL: "http://localhost:8333/memora-uploads"
      # STORAGE_S3_BUCKET: "memora-uploads"
      # STORAGE_S3_ENDPOINT_URL: "http://seaweedfs:8333"
      # STORAGE_S3_REGION: "eu-west-1"
      # STORAGE_S3_ACCESS_KEY: "memora"
      # STORAGE_S3_SECRET_KEY: "memora-secret"
      # STORAGE_S3_PUBLIC_BASE_URL: "http://localhost:8333/memora-uploads"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - postgres

  frontend:
    image: ghcr.io/dut-info-montreuil/memora-frontend:latest
    restart: unless-stopped
    environment:
      - API_URL=https://yourdomain
    ports:
      - "8080:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- SeaweedFS (S3-compatible) example ---
  # seaweedfs:
  #   image: chrislusf/seaweedfs:latest
  #   restart: unless-stopped
  #   command: >
  #     server -s3 -master -volume -dir=/data
  #   ports:
  #     - "9333:9333"
  #     - "8333:8333"
  #   volumes:
  #     - seaweedfs_data:/data

volumes:
  backend_data:
  backend_uploads:
  postgres_data:
  # seaweedfs_data:
